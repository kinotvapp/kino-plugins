site_name: Plugins de Kino
site_description: Cómo escribir, probar y publicar un plugin de video, TV en vivo, música o podcasts para Kino.
site_url: https://kinotvapp.github.io/kino-plugins/
repo_url: https://github.com/kinotvapp/kino-plugins
repo_name: kinotvapp/kino-plugins
edit_uri: edit/main/docs/

docs_dir: docs
site_dir: site

theme:
  name: material
  language: es
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep orange
      accent: amber
      toggle:
        icon: material/weather-night
        name: Modo oscuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep orange
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Modo claro
  icon:
    repo: fontawesome/brands/github

extra_css:
  - assets/extra.css
  - assets/theme-creator.css
  - assets/docs-chat.css
extra_javascript:
  - assets/theme-creator.js
  - assets/kino-ai.js
  - assets/docs-chat.js

plugins:
  - search
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: es
          name: Español
          default: true
          build: true
        - locale: en
          name: English
          build: true
          site_name: Kino plugins
          site_description: How to write, test and publish a video, live TV, music or podcast plugin for Kino.
          nav_translations:
            Inicio: Home
            Empezar: Get started
            Primer plugin: A first plugin
            Plugins de ejemplo: Example plugins
            Crear un plugin con IA: Build a plugin with AI
            Aparecer en Kino: Get listed in Kino
            Plugins firmados: Signed plugins
            Firma tu plugin, paso a paso: Sign your plugin, step by step
            Novedades: What's new
            Guía: Guide
            Manifiesto: The manifest
            Contrato: The contract
            API kino: The kino API
            Protocolo entre plugins: The plugin protocol
            El protocolo en una página: The protocol on one page
            Canales en vivo: Live channels
            Música y podcasts: Music and podcasts
            Límites y trampas del motor: Limits and engine quirks
            Probar en local: Test it locally
            Publicar: Publishing
            Lo que ve la persona: What people see
            Recetario: Cookbook
            Scrapers de Nuvio: Nuvio scrapers
            Plugins con scrapers de Nuvio: Plugins that use Nuvio scrapers
            Addons de Stremio: Stremio addons
            Plugins de CloudStream: CloudStream plugins
            Referencia: Reference
            Personaliza tu plugin: Customize your plugin
            Formulario de ajustes: The settings form
            Firma por petición: Signing every request
            Resolutores externos: External resolvers
            Proveedores de sincronización: Sync providers
            Sockets y bytes del plugin: Sockets and plugin-served bytes
            Catálogo y almacenamiento grande: Catalog and large storage
            Imágenes del plugin: Images from the plugin
            Códigos QR: QR codes
            Archivos del aparato: Files on the device
            Navegador oculto: Hidden browser
            Ventana de navegador visible: A browser window the person drives
            Pasar lo guardado: Moving saved titles
            "Sección, categorías y colores": Section, categories and colors
            Temas de la app: App themes
            Creador de temas: Theme creator
            Panel del reproductor: The player panel
            Home por categorías: Home categories
            Registro y telemetría: Logs and telemetry
            Reclamos y retiro de plugins: Claims and plugin takedowns
            Pantallas: Screens
            Pantallas del plugin: Plugin screens
            "Componentes: diseño, contenido y acciones": "Components: layout, content and actions"
            "Componentes: formularios, ventanas y navegación": "Components: forms, overlays and navigation"
            "Componentes: estado, estilo y recetas": "Components: state, style and recipes"
            "Salas, biblioteca y control del reproductor": "Rooms, the library and player control"
            "Trabajos, resultados compartidos e IA": "Background jobs, shared results and AI"
            Pantallas sin subir tu apiVersion: Screens without raising your apiVersion
            Estructurar un plugin grande: Structure a bigger plugin
            Exportar e importar un plugin: Exporting and importing a plugin
            Identidad: Identity
            Avisos en la campanita: Notices in the bell
            Tiendas de plugins: Plugin stores
            Tiendas de ejemplo: Example stores
            Plugins que vienen instalados: Plugins that come installed
            Fundamentos: Fundamentals
            Interfaz (UI): Interface (UI)
            Contenido y reproducción: Content and playback
            Protocolo y datos: Protocol and data
            Compatibilidad: Compatibility
            Probar y publicar: Test and publish

hooks:
  - hooks/llms.py

nav:
  - Empezar:
      - Inicio: index.md
      - Primer plugin: first-plugin.md
      - Plugins de ejemplo: examples.md
      - Crear un plugin con IA: ai.md
  - Fundamentos:
      - Manifiesto: manifest.md
      - Contrato: contract.md
      - API kino: kino-api.md
      - Límites y trampas del motor: engine-limits.md
      - Estructurar un plugin grande: structure.md
      - Recetario: cookbook.md
  - Interfaz (UI):
      - Pantallas:
          - Pantallas del plugin: screens.md
          - "Componentes: diseño, contenido y acciones": screen-components.md
          - "Componentes: formularios, ventanas y navegación": screen-forms.md
          - "Componentes: estado, estilo y recetas": screen-reference.md
          - "Salas, biblioteca y control del reproductor": rooms.md
          - "Trabajos, resultados compartidos e IA": jobs-and-shared.md
          - Pantallas sin subir tu apiVersion: enhancements.md
      - Temas de la app: themes.md
      - Creador de temas: theme-creator.md
      - "Sección, categorías y colores": section-theme.md
      - Home por categorías: categories.md
      - Panel del reproductor: player-panel.md
      - Personaliza tu plugin: customize.md
      - Formulario de ajustes: settings-form.md
      - Imágenes del plugin: images.md
      - Códigos QR: qr.md
      - Avisos en la campanita: notifications.md
      - Lo que ve la persona: what-people-see.md
  - Contenido y reproducción:
      - Canales en vivo: live-channels.md
      - Música y podcasts: music.md
      - Catálogo y almacenamiento grande: catalog.md
      - Firma por petición: signed-streams.md
      - Resolutores externos: resolver.md
  - Protocolo y datos:
      - Protocolo entre plugins: protocol.md
      - El protocolo en una página: protocol-quick.md
      - Identidad: identity.md
      - Proveedores de sincronización: sync-providers.md
      - Tiendas de plugins: plugin-stores.md
      - Tiendas de ejemplo: store-examples.md
      - Sockets y bytes del plugin: bytes.md
      - Archivos del aparato: files.md
      - Navegador oculto: browser.md
      - Ventana de navegador visible: visual-browser.md
      - Pasar lo guardado: migrate.md
  - Compatibilidad:
      - Scrapers de Nuvio: nuvio.md
      - Plugins con scrapers de Nuvio: nuvio-plugins.md
      - Addons de Stremio: stremio.md
      - Plugins de CloudStream: cloudstream.md
  - Probar y publicar:
      - Probar en local: test-locally.md
      - Publicar: publish.md
      - Aparecer en Kino: listed.md
      - Plugins firmados: signed.md
      - Firma tu plugin, paso a paso: sign-tutorial.md
      - Exportar e importar un plugin: plugin-files.md
      - Plugins que vienen instalados: default-plugins.md
      - Registro y telemetría: diagnostics.md
      - Reclamos y retiro de plugins: claims.md
  - Novedades: changelog.md
  - Referencia: reference/index.md

markdown_extensions:
  - toc:
      permalink: true
  - tables
  - attr_list
  - md_in_html
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: false
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: [docs]
      check_paths: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

validation:
  omitted_files: warn
  absolute_links: info
  unrecognized_links: warn
  anchors: warn

not_in_nav: |
  /llms.txt

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/kinotvapp/kino-plugins
    - icon: fontawesome/brands/telegram
      link: https://t.me/Kinoapptv
