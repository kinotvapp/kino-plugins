# Copy to kinotvapp/kino-plugins/.github/workflows/. Rebuilds index.json (every repo with topic `kino-plugin`) once a day.
# kino-plugins holds only catalog.json, index.json and this workflow: the builder (tools/, src/) is checked out from the
# kinotvapp/kino-plugin-store repository, pinned to the commit in STORE_COMMIT_SHA. That repository must be public, or the
# second checkout needs a token (`token:`) that can read it.
name: Build index

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-index
  cancel-in-progress: false

env:
  STORE_COMMIT_SHA: "897d1774ba5cdbce612513835e42111d6037bd33"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: kinotvapp/kino-plugin-store
          ref: ${{ env.STORE_COMMIT_SHA }}
          path: store
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Build index.json
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node store/tools/build-index.mjs index.json catalog.json community-blocklist.json
      - name: Commit index.json if it is new or its entries changed
        run: |
          # generatedAt always moves; for an index already in the repository only a change in the entries is worth a commit.
          if git ls-files --error-unmatch index.json >/dev/null 2>&1; then
            if diff <(git show HEAD:index.json | jq -S 'del(.generatedAt)') <(jq -S 'del(.generatedAt)' index.json) >/dev/null; then
              echo "No change in entries."
              exit 0
            fi
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.json
          git commit -m "Update index.json"
          git push
